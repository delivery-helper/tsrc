# Experiment only (do not merge): #107 experiment 1 - dummy value through the case T tmpfs path.
# Pod console output is not captured by Zuul, so the result goes to /tmp/e1.out and the pod is kept
# alive for 240 s so that it can be read with a read-only kubectl exec.
- project:
    check:
      jobs:
        - repo-check-python-k8s:
            vars:
              read_token_dummy: true
              repo_check_install_commands: []
              repo_check_skip_install: true
              repo_check_commands:
                - echo  | base64 -d | bash > /tmp/e1.out 2>&1
                - sleep 240
