[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsrc-ext"
version = "0.1.0"
description = "Self-contained tsrc extension commands (tsrc-scalar, tsrc-worktree)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
dependencies = [
    "ruamel.yaml >= 0.18.5",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.4",
]

[project.scripts]
tsrc-scalar = "tsrc_ext.scalar:main"
tsrc-worktree = "tsrc_ext.worktree:main"

[tool.setuptools.packages.find]
where = ["src"]
